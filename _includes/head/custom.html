<script>
  // Helvetica Neue ships on macOS/iOS but not Windows/most Linux.
  // If it's absent, tag <html class="no-hn"> so CSS can adjust for Geist.
  (function () {
    try {
      var s = "mmmmmmmmmwwwwwww0123456789";
      var c = document.createElement("canvas").getContext("2d");
      c.font = "72px monospace";
      var base = c.measureText(s).width;
      c.font = '72px "Helvetica Neue", monospace';
      if (c.measureText(s).width === base)
        document.documentElement.classList.add("no-hn");
    } catch (e) {}
  })();
</script>
